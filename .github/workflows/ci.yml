name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or PR cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1 # same as rust-toolchain.toml
          components: rustfmt
      - run: cargo fmt --all --check

  # the lints that fight the house style are allowed in [workspace.lints.clippy] in Cargo.toml
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1 # same as rust-toolchain.toml
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1 # same as rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # the Windows-only client code (cfg(windows), e.g. reading MachineGuid) must
  # compile and pass clippy on every push, not only on release day
  windows-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1 # same as rust-toolchain.toml
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # same cross linker as release.yml, in case a dependency's build script needs it
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo clippy --locked --target x86_64-pc-windows-gnu -p reporter --all-targets -- -D warnings

  # shell scripts and the Python dashboard (shellcheck is preinstalled on ubuntu runners)
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck get.sh deploy/install.sh deploy/uninstall.sh scripts/*.sh
      # licence guard (T-053): no character pack file may ever be tracked
      - run: scripts/check-no-pack-files.sh
      - run: python3 -m py_compile pi/*.py pi/tests/*.py
      # pure dashboard helpers (layout, charpack), the pack installer and the
      # fake-root shell tests; stdlib unittest, no pygame needed
      - run: python3 -m unittest discover -s pi/tests -v

  # trial Pi bundle build, so packaging breaks on the PR and not on release day
  package:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1 # same as rust-toolchain.toml
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked --target aarch64-unknown-linux-musl -p daemon -p reporter
      - run: scripts/package-pi-bundle.sh
      - run: tar tzvf dist/deskpane-pi-aarch64.tar.gz
      # licence guard (T-053): the bundle never carries images or zips
      - run: |
          if tar tzf dist/deskpane-pi-aarch64.tar.gz | grep -Ei '\.(png|zip)$'; then
            echo "error: the Pi bundle contains image or zip files (character pack?)" >&2
            exit 1
          fi
