name: Release

# On every push to main, release-please keeps a release PR up to date: the
# next semantic version (from Conventional Commits) and CHANGELOG.md.
# Merging that PR tags vX.Y.Z and creates a draft GitHub Release. The build
# jobs then make the downloads, and the publish job attaches them all with
# SHA256SUMS and publishes the release, so a release is never public with
# missing files.
#
# The build runs in this same workflow on purpose: a tag created with the
# workflow's own GITHUB_TOKEN does not trigger other workflows, so a separate
# tag-triggered workflow would never run.
on:
  push:
    branches: [main]

permissions:
  contents: read

# two quick pushes to main must not race on the release PR
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-pi-bundle:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1 # same as rust-toolchain.toml
          targets: aarch64-unknown-linux-musl
      - name: Build
        run: cargo build --release --locked --target aarch64-unknown-linux-musl -p daemon -p reporter
      - name: Package
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: scripts/package-pi-bundle.sh --version "${TAG#v}" --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-bundle
          path: dist/pi-homelab-dashboard-pi-aarch64.tar.gz
          if-no-files-found: error

  build-reporter:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: reporter-linux-x86_64
            os: linux
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            archive: reporter-linux-aarch64
            os: linux
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
            archive: reporter-windows-x86_64
            os: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1 # same as rust-toolchain.toml
          targets: ${{ matrix.target }}

      - name: Install the Windows cross linker
        if: matrix.os == 'windows'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p reporter

      # one top-level directory per archive: reporter-<version>-<os>-<arch>/
      - name: Package
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          OS: ${{ matrix.os }}
        run: |
          version="${TAG#v}"
          top="${ARCHIVE/reporter-/reporter-$version-}"
          mkdir -p "stage/$top" dist
          cp LICENSE "stage/$top/"
          if [[ "$OS" == windows ]]; then
            cp "target/$TARGET/release/reporter.exe" "stage/$top/"
            printf 'reporter %s for Windows\r\n\r\nExample: reporter.exe run --daemon 192.168.1.50:8765 --device-id my-pc --label "My PC"\r\n' "$version" >"stage/$top/README.txt"
            (cd stage && zip -9 -r "../dist/$ARCHIVE.zip" "$top")
          else
            cp "target/$TARGET/release/reporter" "stage/$top/"
            printf 'reporter %s for Linux (static binary)\n\nExample: ./reporter run --daemon 192.168.1.50:8765 --device-id my-pc --label "My PC"\n' "$version" >"stage/$top/README.txt"
            tar -C stage -czf "dist/$ARCHIVE.tar.gz" "$top"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive }}
          path: dist/*
          if-no-files-found: error

  # attach every download plus SHA256SUMS in one upload, then publish the draft
  publish:
    needs: [release-please, build-pi-bundle, build-reporter]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip >SHA256SUMS
          cat SHA256SUMS
      - name: Attach and publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" *.tar.gz *.zip SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false
