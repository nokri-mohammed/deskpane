name: Release

# On every push to main, release-please keeps a release PR up to date: the
# next semantic version (from Conventional Commits) and CHANGELOG.md.
# Merging that PR tags vX.Y.Z and creates the GitHub Release; the build jobs
# below then attach the binaries to it.
#
# The build runs in this same workflow on purpose: a tag created with the
# workflow's own GITHUB_TOKEN does not trigger other workflows, so a separate
# tag-triggered workflow would never run.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: daemon
            target: aarch64-unknown-linux-gnu
            name: daemon-aarch64-unknown-linux-gnu
          - package: reporter
            target: aarch64-unknown-linux-gnu
            name: reporter-aarch64-unknown-linux-gnu
          - package: reporter
            target: x86_64-unknown-linux-gnu
            name: reporter-x86_64-unknown-linux-gnu
          - package: reporter
            target: x86_64-pc-windows-gnu
            name: reporter-x86_64-pc-windows-gnu
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross linker (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross linker (windows/mingw)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --target ${{ matrix.target }} -p ${{ matrix.package }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/${{ matrix.name }}.tar.gz" "${{ matrix.package }}${{ matrix.ext }}"

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "${{ matrix.name }}.tar.gz" --clobber
