[package]
name = "reporter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# the shipped client binary name; the crate stays `reporter`
[[bin]]
name = "deskpane"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
daemon = { path = "../daemon" }
sysinfo = "0.32"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
