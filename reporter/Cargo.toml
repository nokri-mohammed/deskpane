[package]
name = "reporter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# the shipped client binary name; the crate stays `reporter`
[[bin]]
name = "deskpane"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
daemon = { path = "../daemon" }
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the keys of ~/.claude/settings.json in their order (install-hooks)
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
