[package]
name = "deskpane-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# the shared wire types (device reports, agent packets, the socket envelope) and
# their validators, depended on by the daemon, the reporter and future plugins.
# the library name stays deskpane_contract so plugin authors import one clear name.
[lib]
name = "deskpane_contract"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
